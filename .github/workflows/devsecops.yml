name: Citizen Tech DevSecOps

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # FASE 1: Checkout
      - name: "01 - Checkout"
        uses: actions/checkout@v4

      # FASE 2: Ambiente
      - name: "02 - Configurar Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # FASE 3: Ferramentas
      - name: "03 - Preparar ferramentas"
        run: |
          python -m pip install semgrep
          mkdir -p reports
          chmod 777 reports

      # FASE 4: SAST
      - name: "04 - Semgrep"
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --json \
            --output reports/semgrep.json \
            .

      # FASE 5: Segredos
      - name: "05 - Gitleaks"
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # FASE 6: SCA
      - name: "06 - Dependency SCA - Trivy"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: reports/sca.json
          exit-code: "0"

      # FASE 5: Testes
      - name: "05 - Testes de sintaxe (unit test / smoke test)"
        run: |
          python -m compileall -q app.py config.py
          echo "Testes de sintaxe aprovados"

      # FASE 7: Container
      - name: "07 - Build Docker"
        run: docker build -t citizen-tech:ci .

      - name: "07 - Trivy Container"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: citizen-tech:ci
          format: json
          output: reports/trivy.json
          exit-code: "0"

      # FASE 8: DAST
      - name: "08 - Iniciar Flask"
        run: |
          docker run -d --name citizen-tech-ci \
            -p 127.0.0.1:5000:5000 \
            citizen-tech:ci
          sleep 10
          curl --fail http://127.0.0.1:5000/

      - name: "08 - OWASP ZAP"
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$PWD/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://127.0.0.1:5000/ \
            -J zap.json -I

      # Publicacao
      - name: "Publicar relatorios"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn

      # GATE FINAL
      - name: "Security Gate"
        if: always()
        env:
          GITLEAKS_RESULT: ${{ steps.gitleaks.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          bloqueado = False

          if os.environ.get("GITLEAKS_RESULT") != "success":
              print("Gitleaks falhou ou detectou segredos")
              bloqueado = True

          obrigatorios = [
              "reports/semgrep.json",
              "reports/sca.json",
              "reports/trivy.json",
              "reports/zap.json",
          ]

          for caminho in obrigatorios:
              if not os.path.isfile(caminho):
                  print("Relatorio ausente:", caminho)
                  bloqueado = True

          if os.path.isfile("reports/semgrep.json"):
              with open("reports/semgrep.json") as f:
                  dados = json.load(f)

              for achado in dados.get("results", []):
                  severidade = achado.get("extra", {}).get("severity")
                  if severidade == "ERROR":
                      print("SAST bloqueado:", achado.get("check_id"))
                      bloqueado = True

          for caminho in ("reports/sca.json", "reports/trivy.json"):
              if not os.path.isfile(caminho):
                  continue

              with open(caminho) as f:
                  dados = json.load(f)

              for resultado in dados.get("Results", []):
                  for vuln in resultado.get("Vulnerabilities", []):
                      if vuln.get("Severity") in ("CRITICAL", "HIGH"):
                          print("CVE grave:", vuln.get("VulnerabilityID"))
                          bloqueado = True

          if os.path.isfile("reports/zap.json"):
              with open("reports/zap.json") as f:
                  dados = json.load(f)

              for site in dados.get("site", []):
                  for alerta in site.get("alerts", []):
                      if str(alerta.get("riskcode")) in ("2", "3"):
                          print("DAST bloqueado:", alerta.get("name"))
                          bloqueado = True

          if bloqueado:
              print("SECURITY GATE: BLOQUEADO")
              sys.exit(1)

          print("SECURITY GATE: APROVADO")
          PY

      # FASE 8: Deploy protegido
      # Só executa se todos os passos anteriores, inclusive o Security Gate,
      # terminarem com sucesso. Não publica a aplicação na internet.
      - name: "08 - Deploy em ambiente temporario"
        if: success()
        run: |
          docker run -d --name citizen-tech-deploy             -p 127.0.0.1:5001:5000 citizen-tech:ci
          curl --retry 5 --retry-delay 2 --retry-connrefused             --fail http://127.0.0.1:5001/
          echo "Deploy temporario aprovado"
